# Candidates for the house voice, compared in `python -m explainer.voices`.
# All local and free. Piper: one model per voice (~20–115 MB each).
# Kokoro: one shared model (~350 MB) holds every Kokoro voice.

[paragraph]
es = """
El descenso por gradiente ajusta los pesos del modelo paso a paso. En cada paso, calcula hacia dónde sube la pérdida y se mueve en la dirección contraria. Si la tasa de aprendizaje es muy grande, el modelo salta de un lado al otro. Si es muy chica, aprende demasiado lento. ¿Cómo elegimos un buen valor?
"""
en = """
Gradient descent adjusts the model weights one step at a time. At each step, it computes where the loss goes up and moves the other way. If the learning rate is too large, the model jumps from side to side. If it is too small, it learns far too slowly. So how do we pick a good value?
"""

