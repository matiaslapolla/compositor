[project]
name = "compositor-manim"
version = "0.1.0"
requires-python = ">=3.13"
# textual stays: explainer/voices.py (the voice-picker TUI) imports it at module load.
dependencies = [
    "manim[typst]==0.21.0",
    "manim-voiceover==0.4.0",
    "piper-tts[alignment]==1.8.0",
    "kokoro-onnx==0.6.1",
    "textual==8.2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["explainer"]
only-include = ["explainer", "bounds.py"]
