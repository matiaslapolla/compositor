<!doctype html>
<html lang="{{language|en}}">
<head>
<meta charset="UTF-8">
<title>{{brand.name}} promo</title>
<script src="gsap.min.js"></script>
<script>document.documentElement.dataset.orient = {{target.width}} > {{target.height}} ? "landscape" : "portrait";</script>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-bg); color: var(--color-fg); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--color-bg); }

  /* Type scale: landscape sizes against the height, in-feed portrait sizes against the width. */
  html[data-orient="landscape"] {
    --t-hero: calc(var(--h) * 0.12); --t-head: calc(var(--h) * 0.085); --t-body: calc(var(--h) * 0.042);
    --t-label: calc(var(--h) * 0.027); --t-cap: calc(var(--h) * 0.046); --t-stat: calc(var(--h) * 0.29);
    --measure: 80%; --gap: calc(var(--h) * 0.035);
  }
  html[data-orient="portrait"] {
    --t-hero: calc(var(--w) * 0.112); --t-head: calc(var(--w) * 0.094); --t-body: calc(var(--w) * 0.05);
    --t-label: calc(var(--w) * 0.033); --t-cap: calc(var(--w) * 0.05); --t-stat: calc(var(--w) * 0.36);
    --measure: 100%; --gap: calc(var(--w) * 0.045);
  }
  :root { --band: calc(var(--t-cap) * 2.75); --chip: calc(var(--t-label) * 1.5); }

  .grain { position: absolute; inset: 0; pointer-events: none; opacity: var(--grain-opacity, 0.06); mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 1 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"); }

  .chip { position: absolute; top: var(--safe-top); left: var(--safe-left); height: var(--chip); display: flex; align-items: center; gap: calc(var(--t-label) * 0.5);
    font-family: var(--font-display); font-weight: 650; font-size: var(--t-label); letter-spacing: var(--tracking-display); line-height: 1; }
  .chip img, .chip svg { height: 100%; width: auto; aspect-ratio: 1; border-radius: calc(var(--radius) * 0.6); display: block; }

  .stage { position: absolute; inset: 0; }
  .frame { position: absolute; top: calc(var(--safe-top) + var(--chip) + var(--gap)); left: var(--safe-left); right: var(--safe-right);
    bottom: calc(var(--safe-bottom) + var(--band) + var(--gap) * 0.5); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: var(--gap); }

  .kicker { margin: 0; font-family: var(--font-mono, var(--font-body)); font-size: var(--t-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted); }
  .headline { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: var(--tracking-display); line-height: 1.08; text-wrap: balance;
    font-size: var(--t-head); max-width: var(--measure); isolation: isolate; }
  .hero { font-size: var(--t-hero); }
  .headline .w { display: inline-block; white-space: pre; position: relative; }
  .mark { position: relative; white-space: nowrap; isolation: isolate; padding-left: 0.06em; }
  .mark-bg { position: absolute; left: 0; right: -0.06em; top: 0.1em; bottom: 0.03em; background: var(--color-accent); border-radius: 0.04em; }
  .body { margin: 0; font-size: var(--t-body); line-height: 1.32; color: var(--color-muted); max-width: 30ch; }

  .items { list-style: none; margin: 0; padding: 0; display: grid; width: 100%; max-width: 36ch; font-size: var(--t-body); line-height: 1.25; }
  .items li { display: flex; gap: 0.9em; align-items: baseline; padding: 0.55em 0; border-top: 1px solid var(--color-border); }
  .items li:last-child { border-bottom: 1px solid var(--color-border); }
  .items .n { font-family: var(--font-mono, var(--font-body)); font-size: 0.6em; letter-spacing: 0.06em; color: var(--color-muted); }

  html[data-orient="landscape"] .frame--split { display: grid; grid-template-columns: 1.1fr 1fr; column-gap: 7%; align-items: center; justify-content: stretch; }
  html[data-orient="landscape"] .frame--split .col { display: flex; flex-direction: column; gap: var(--gap); }
  html[data-orient="landscape"] .frame--split .headline { max-width: 100%; }
  html[data-orient="portrait"] .frame--split .col { display: flex; flex-direction: column; gap: var(--gap); width: 100%; }
  .shot { display: block; width: 100%; max-height: 100%; object-fit: cover; object-position: top center; border-radius: calc(var(--radius) * 2); border: 1px solid var(--color-border);
    box-shadow: 0 40px 90px -20px rgba(0, 0, 0, 0.45); }
  .frame--capture { justify-content: flex-start; }
  .frame--capture .shot { flex: 1 1 auto; min-height: 0; }

  .stat-num { margin: 0; font-family: var(--font-display); font-weight: 750; font-size: var(--t-stat); line-height: 0.86; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .meter { width: min(100%, calc(var(--t-stat) * 2.6)); height: calc(var(--t-label) * 0.42); background: var(--color-border); border-radius: var(--radius-pill); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 100%; background: var(--color-accent); transform-origin: 0 50%; }
  .frame--stat .headline { font-size: calc(var(--t-head) * 0.82); max-width: min(var(--measure), 22ch); }
  .source { margin: 0; font-size: var(--t-label); color: var(--color-muted); }

  .quote::before { content: "\201C"; } .quote::after { content: "\201D"; }

  .frame--end { align-items: center; text-align: center; }
  .frame--end .headline { max-width: 100%; }
  .lockup { display: flex; align-items: center; gap: calc(var(--t-head) * 0.3); font-family: var(--font-display); font-weight: 700; font-size: calc(var(--t-head) * 0.62);
    letter-spacing: var(--tracking-display); line-height: 1; }
  .lockup img, .lockup svg { height: 1.5em; width: auto; aspect-ratio: 1; border-radius: calc(var(--radius) * 1.2); display: block; }
  .cta { display: inline-block; font-family: var(--font-display); font-weight: 650; font-size: var(--t-body); line-height: 1; color: var(--color-accent-fg); background: var(--color-accent);
    padding: 0.5em 0.95em; border-radius: var(--radius-pill); }

  .captions { position: absolute; left: var(--safe-left); right: var(--safe-right); bottom: var(--safe-bottom); height: var(--band); }
  .cue { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center;
    font-family: var(--font-body); font-weight: 500; font-size: var(--t-cap); line-height: 1.22; color: var(--color-fg); }
  .cue .line { display: block; white-space: nowrap; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{duration}}">
  <div class="chip" id="chip">
    {{#logo.markSvg}}{{{logo.markSvg}}}{{/logo.markSvg}}{{^logo.markSvg}}{{#logo.mark}}<img src="{{logo.mark}}" alt="">{{/logo.mark}}{{/logo.markSvg}}
    <span>{{brand.name}}</span>
  </div>
  <div class="captions" id="captions"></div>
  <div class="grain" data-layout-ignore></div>
  {{#voSrc}}<audio id="vo" src="{{voSrc}}" data-start="0" data-duration="{{duration}}" data-track-index="9"></audio>{{/voSrc}}
</div>
<script type="application/json" id="promo-params">{{{json}}}</script>
<script>
(function () {
  const P = JSON.parse(document.getElementById("promo-params").textContent);
  const root = document.getElementById("root");
  const chip = document.getElementById("chip");
  const D = Number(P.duration);
  const css = getComputedStyle(document.documentElement);
  const color = (role) => css.getPropertyValue(`--color-${role}`).trim();
  const rise = () => parseFloat(css.getPropertyValue("--t-body")) * 0.7 || 32;
  const scenes = P.scenes || [];
  const cues = P.captions || [];
  const spoken = cues.flatMap((c) => c.words || []);
  const norm = (w) => String(w).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\p{L}\p{N}]/gu, "");

  const h = (tag, cls, text) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text != null) el.textContent = text;
    return el;
  };
  // "*word*" marks the accent highlight; words become spans for the title cascade.
  function headline(tag, cls, text) {
    const el = h(tag, `headline ${cls || ""}`.trim());
    String(text).split(/(\*[^*]+\*)/).filter(Boolean).forEach((part) => {
      const marked = /^\*[^*]+\*$/.test(part);
      const host = marked ? h("span", "mark") : el;
      if (marked) host.appendChild(h("span", "mark-bg"));
      part.replace(/^\*|\*$/g, "").split(/(\s+)/).forEach((t) => {
        if (!t) return;
        host.appendChild(/^\s+$/.test(t) ? document.createTextNode(t) : h("span", "w", t));
      });
      if (marked) el.appendChild(host);
    });
    return el;
  }

  // Scene DOM: one root-level clip per scene; .stage carries the seam, children carry the reveals.
  const built = scenes.map((s, i) => {
    const n = i + 1;
    const clip = h("section", `clip scene scene--${s.kind}`);
    clip.id = `scene-${n}`;
    clip.dataset.start = String(s.start);
    clip.dataset.duration = String(Math.max(0.001, s.end - s.start));
    clip.dataset.trackIndex = "1";
    const stage = h("div", "stage");
    stage.id = `stage-${n}`;
    const frame = h("div", `frame frame--${s.kind}`);
    const reveals = [];
    const add = (parent, el, reveal = true) => { parent.appendChild(el); if (reveal) reveals.push(el); return el; };
    let head = null, stat = null, meter = null, kicker = null;

    if (s.kind === "stat") {
      stat = add(frame, h("p", "stat-num", s.stat), false);
      const m = String(s.stat).match(/^([^\d-]*)(-?\d+(?:[.,]\d+)?)(.*)$/);
      stat.__parts = m ? { pre: m[1], value: parseFloat(m[2].replace(",", ".")), dec: (m[2].split(/[.,]/)[1] || "").length, sep: m[2].includes(",") ? "," : ".", post: m[3] } : null;
      if (stat.__parts && /^\s*%/.test(stat.__parts.post) && stat.__parts.value > 0 && stat.__parts.value <= 100) {
        meter = add(frame, h("div", "meter"), false);
        meter.appendChild(h("i"));
      }
      if (s.label) add(frame, headline("p", "", s.label));
      if (s.body) add(frame, h("p", "source", s.body));
    } else if (s.kind === "end") {
      const lockup = add(frame, h("div", "lockup"), false);
      [...chip.childNodes].forEach((c) => lockup.appendChild(c.cloneNode(true)));
      if (s.headline) head = add(frame, headline("h2", "", s.headline));
      if (s.label) add(frame, h("span", "cta", s.label));
      if (s.body) add(frame, h("p", "body", s.body));
    } else if (s.kind === "capture") {
      if (s.label) add(frame, h("p", "kicker", s.label), false);
      if (s.headline) head = add(frame, headline("h2", "", s.headline), false);
      add(frame, Object.assign(h("img", "shot"), { src: s.image, alt: "" }));
      if (s.body) add(frame, h("p", "body", s.body));
    } else if (s.kind === "feature" && (s.image || (s.items && s.items.length))) {
      frame.classList.add("frame--split");
      const text = h("div", "col"), side = h("div", "col");
      frame.append(text, side);
      if (s.label) add(text, h("p", "kicker", s.label), false);
      head = add(text, headline("h2", "", s.headline), false);
      if (s.body) add(text, h("p", "body", s.body));
      if (s.image) add(side, Object.assign(h("img", "shot"), { src: s.image, alt: "" }));
      if (s.items && s.items.length) {
        const ol = add(side, h("ol", "items"), false);
        s.items.forEach((it, k) => {
          const li = add(ol, h("li"));
          li.append(h("span", "n", String(k + 1).padStart(2, "0")), h("span", "", it));
        });
      }
    } else {
      const first = i === 0;
      if (s.label) kicker = add(frame, h("p", "kicker", s.kind === "quote" ? `— ${s.label}` : s.label), false);
      head = add(frame, headline(first ? "h1" : "h2", s.kind === "quote" ? "quote" : "hero", s.headline), false);
      if (s.kind === "quote" && s.label) frame.appendChild(frame.firstChild);
      if (s.body) add(frame, h("p", "body", s.body));
    }
    stage.appendChild(frame);
    clip.appendChild(stage);
    root.insertBefore(clip, chip);
    return { s, i, clip, stage, frame, reveals, head, stat, meter, kicker };
  });

  // Captions: one timed cue per entry, two plain lines; karaoke lifts the spoken word.
  const band = document.getElementById("captions");
  const karaoke = P.captionStyle === "karaoke";
  const capWords = [];
  cues.forEach((c, k) => {
    const cue = h("div", "clip cue");
    cue.id = `cue-${k + 1}`;
    cue.dataset.start = String(c.start);
    cue.dataset.duration = String(Math.max(0.001, c.end - c.start));
    cue.dataset.trackIndex = "2";
    let w = 0;
    (c.lines || []).forEach((text) => {
      const line = h("span", "line");
      if (karaoke && c.words && c.words.length) {
        text.split(/(\s+)/).forEach((t) => {
          if (!t) return;
          if (/^\s+$/.test(t)) return line.appendChild(document.createTextNode(t));
          const span = line.appendChild(h("span", "cw", t));
          capWords.push({ el: span, start: (c.words[w++] || c.words[c.words.length - 1]).start });
        });
      } else line.textContent = text;
      cue.appendChild(line);
    });
    band.appendChild(cue);
  });

  const tl = gsap.timeline({ paused: true });
  const R = rise();
  const ENTER = 0.42, EXIT = 0.34, REVEAL = 0.6;

  // Seam base states (seam-stamp equivalent: first stage shown, the rest hidden until their cut).
  gsap.set(built.map((b) => b.stage), { autoAlpha: 0, xPercent: 0 });
  if (built.length) gsap.set(built[0].stage, { autoAlpha: 1 });
  gsap.set(chip, { opacity: 0, x: R * 0.6 });
  tl.to(chip, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.1);

  // Cut the curve, current LEFT: exit accelerates out mid-motion, entry ignites mid-flight on the cut.
  built.slice(1).forEach((b) => {
    const prev = built[b.i - 1];
    const cut = b.s.start;
    tl.to(prev.stage, { xPercent: -12, autoAlpha: 0, duration: EXIT, ease: "power3.in" }, Math.max(0, cut - EXIT));
    tl.set(prev.stage, { autoAlpha: 0 }, cut);
    tl.fromTo(b.stage, { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: ENTER, ease: "power4.out", immediateRender: false }, cut);
    if (b.s.kind === "end") tl.to(chip, { opacity: 0, x: -R, duration: EXIT, ease: "power3.in" }, Math.max(0, cut - EXIT));
  });

  // Beats: the first spoken word of a reveal's text, in order, inside the scene's window.
  function wordTime(text, from, to) {
    const first = norm(String(text || "").replace(/\*/g, "").trim().split(/\s+/)[0] || "");
    if (!first) return null;
    const hit = spoken.find((w) => w.start >= from && w.start < to && norm(w.text) === first);
    return hit ? hit.start : null;
  }

  built.forEach((b) => {
    const { s, i } = b;
    const last = i === built.length - 1;
    const enterDone = s.start + (i === 0 ? 0.75 : ENTER + 0.1);
    const deadline = last ? D - 1.5 - REVEAL : s.end - EXIT - REVEAL - 0.15;
    let t = enterDone;

    if (i === 0 && b.head) {
      // Waterfall entry (cut-the-curve §6): words whip up from below, gaps shrinking, binary opacity.
      const words = [...b.head.querySelectorAll(".w")];
      gsap.set(words, { opacity: 0, y: R * 1.6 });
      if (b.kicker) {
        gsap.set(b.kicker, { opacity: 0, y: R });
        tl.to(b.kicker, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.04);
      }
      let at = 0.12, gap = 0.075;
      words.forEach((w, k) => {
        tl.set(w, { opacity: 1 }, at);
        tl.to(w, { y: 0, duration: k === words.length - 1 ? 0.24 : 0.2, ease: "power4.out" }, at);
        at += gap; gap *= 0.84;
      });
      t = Math.max(t, at + 0.25);
    }

    if (b.stat && b.stat.__parts) {
      const p = b.stat.__parts;
      const fmt = (v) => p.pre + v.toFixed(p.dec).replace(".", p.sep) + p.post;
      const counter = { v: 0 };
      b.stat.textContent = fmt(0);
      const at = s.start + ENTER * 0.5;
      tl.to(counter, { v: p.value, duration: 1.1, ease: "power2.inOut", onUpdate: () => (b.stat.textContent = fmt(counter.v)) }, at);
      if (b.meter) {
        const fill = b.meter.firstChild;
        gsap.set(fill, { scaleX: 0 });
        tl.to(fill, { scaleX: p.value / 100, duration: 1.1, ease: "power2.inOut" }, at);
      }
      // Stillness before the payoff: the label waits a beat after the count lands.
      t = Math.max(t, at + 1.1 + 0.4);
    }

    const mark = b.head && b.head.querySelector(".mark");
    b.reveals.forEach((el) => {
      const beat = wordTime(el.textContent, t - 0.2, s.end);
      const at = Math.min(Math.max(t, beat ?? t), Math.max(enterDone, deadline));
      gsap.set(el, { opacity: 0, y: R });
      tl.to(el, { opacity: 1, y: 0, duration: REVEAL, ease: "power3.out" }, at);
      t = at + (el.tagName === "LI" ? 0.14 : 0.4);
    });

    if (mark) {
      const bg = mark.querySelector(".mark-bg");
      const words = [...mark.querySelectorAll(".w")];
      gsap.set(bg, { scaleX: 0, transformOrigin: "0% 50%" });
      const beat = wordTime(words.map((w) => w.textContent).join(" "), s.start, s.end);
      const at = Math.min(Math.max(beat ?? s.voStart + s.voDuration * 0.45, i === 0 ? 0.9 : enterDone), Math.max(enterDone, deadline + REVEAL - 0.5));
      tl.to(bg, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, at);
      tl.fromTo(words, { color: color("fg") }, { color: color("accent-fg"), duration: 0.25, ease: "power2.inOut", immediateRender: false }, at + 0.15);
    }
  });

  if (capWords.length) {
    gsap.set(capWords.map((c) => c.el), { color: color("muted") });
    capWords.forEach((c) => tl.set(c.el, { color: color("fg") }, c.start));
  }
  // Pad to the composition length so the final hold is part of the timeline.
  tl.set({}, {}, D);

  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
